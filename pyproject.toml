[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-ai-snake"
version = "1.0.0"
description = "Voice AI verification snake — a 12-stage service verification chain for exposed AI/ML infrastructure."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NuClide Research" }]
keywords = ["security", "ai", "llm", "voice-ai", "scanner", "verification", "assessment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.24",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/zellkernel/voice-ai-snake"
Repository = "https://github.com/zellkernel/voice-ai-snake"
Issues = "https://github.com/zellkernel/voice-ai-snake/issues"

[project.scripts]
snake = "snake_scanner.cli:entry"
snake-web = "snake_scanner.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
